<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini Text Improver Settings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="logo-container">
        <img src="icons/icon48.png" alt="Logo" class="app-logo">
        <div class="app-titles">
          <h1>Gemini Improver</h1>
          <span class="app-subtitle">AI Writing Companion</span>
        </div>
      </div>
      <div class="status-indicator">
        <span class="pulse-dot"></span>
        <span class="status-text">Active</span>
      </div>
    </header>

    <!-- Content -->
    <main class="app-content">
      <!-- Section: API Config -->
      <section class="config-section">
        <div class="section-header">
          <h2>API Configuration</h2>
          <a href="https://aistudio.google.com/" target="_blank" class="link-btn">Get free API Key ↗</a>
        </div>
        
        <div class="input-glow-group">
          <div class="input-with-icon">
            <input type="password" id="api-key-input" placeholder="Paste Gemini API Key here...">
            <button class="icon-toggle-btn" id="toggle-key-visibility" type="button" title="View Key">👁️</button>
          </div>
          <button id="save-key-btn" class="primary-btn shrink-btn">Save Key</button>
        </div>
        <p id="key-status-msg" class="status-msg"></p>
      </section>

      <!-- Section: Model & Toggles -->
      <section class="settings-section">
        <div class="setting-row">
          <label for="model-select">Gemini Model</label>
          <div class="select-glow-wrapper">
            <select id="model-select">
              <optgroup label="Gemini 3 Flash Generation">
                <option value="gemini-3.6-flash" selected>Gemini 3.6 Flash (Default)</option>
                <option value="gemini-3.5-flash">Gemini 3.5 Flash</option>
                <option value="gemini-3.5-flash-lite">Gemini 3.5 Flash Lite</option>
              </optgroup>
              <optgroup label="High Reasoning (Advanced Pro)">
                <option value="gemini-3.1-pro-preview">Gemini 3.1 Pro Preview</option>
              </optgroup>
              <optgroup label="Older Generation Models">
                <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
                <option value="gemini-2.5-pro">Gemini 2.5 Pro</option>
              </optgroup>
            </select>
          </div>
        </div>

        <div class="setting-row" style="margin-top: 12px;">
          <label for="audit-mode-select">Spell Check Mode</label>
          <div class="select-glow-wrapper">
            <select id="audit-mode-select">
              <option value="auto" selected>Automatic (on sentence end)</option>
              <option value="manual">Manual (click icon to check)</option>
            </select>
          </div>
        </div>

        <div class="setting-row">
          <div class="setting-info">
            <label class="switch-label">Floating Spark Button</label>
            <span class="setting-desc">Show inside textareas on focus</span>
          </div>
          <label class="switch">
            <input type="checkbox" id="toggle-bubble-focus" checked>
            <span class="slider"></span>
          </label>
        </div>

        <div class="setting-row">
          <div class="setting-info">
            <label class="switch-label">Selection AI Prompt</label>
            <span class="setting-desc">Show bubble on text selection</span>
          </div>
          <label class="switch">
            <input type="checkbox" id="toggle-selection-bubble" checked>
            <span class="slider"></span>
          </label>
        </div>
      </section>

      <!-- Section: Sandbox Live Test -->
      <section class="test-section">
        <h2>Live API Test</h2>
        <div class="test-input-group">
          <input type="text" id="test-text-input" placeholder="Type text (e.g. 'i is happy')">
          <button id="run-test-btn" class="test-btn">Test AI</button>
        </div>
        <div id="test-result-box" class="result-box hidden">
          <div class="result-header">Result:</div>
          <div id="test-result-output" class="result-content"></div>
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="app-footer">
      <span>Built with Antigravity ✨</span>
      <span class="version-tag">v1.0.0</span>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
